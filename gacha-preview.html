<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>ガチャ演出プレビュー（管理者専用）</title>
<style>
@font-face {
  font-family: 'MihoyoZenZero';
  src: url('font/mihoyo-zenzero.ttf') format('truetype');
}

:root {
  --bg: #12101c;
  --surface: #1c1830;
  --gold: #ffcc00;
  --gold-soft: #ffe37a;
  --text: #f0eeff;
  --muted: #9891b8;
  --border: #38315a;
  --font: 'MihoyoZenZero', 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
  --radius: 16px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: radial-gradient(ellipse at 50% -10%, #2c2450 0%, var(--bg) 55%);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 24px 16px 60px;
  -webkit-user-select: none;
  user-select: none;
}

h1 {
  font-size: 1.15rem;
  color: var(--gold);
  letter-spacing: 0.05em;
  margin-bottom: 4px;
  text-align: center;
}

.subtitle {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 24px;
  text-align: center;
}

/* ===== ロールゲート ===== */
#gate-checking, #gate-denied {
  margin-top: 40vh;
  text-align: center;
  color: var(--muted);
  font-size: 0.9rem;
}
#gate-denied strong { display: block; color: #ff8a8a; font-size: 1.1rem; margin-bottom: 8px; }

#gacha-app { display: none; width: 100%; max-width: 480px; }
#gacha-app.visible { display: flex; flex-direction: column; align-items: center; }

/* ===== 演出パターン選択 ===== */
.variant-picker {
  display: flex;
  gap: 8px;
  margin-bottom: 26px;
  flex-wrap: wrap;
  justify-content: center;
}
.variant-btn {
  font-family: var(--font);
  font-size: 0.76rem;
  font-weight: bold;
  color: var(--muted);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 16px;
  cursor: pointer;
  transition: color 0.2s, background 0.2s, border-color 0.2s;
}
.variant-btn.active {
  color: #241f42;
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  border-color: transparent;
}

/* ===== 全画面演出レイヤー（stageの外、fixedで画面全体に効かせる） ===== */
.flash-overlay {
  position: fixed;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
  z-index: 50;
}
.letterbox {
  position: fixed;
  left: 0; right: 0;
  height: 15vh;
  background: #000;
  z-index: 40;
  transform: scaleY(0);
  pointer-events: none;
}
.letterbox-top { top: 0; transform-origin: top; }
.letterbox-bottom { bottom: 0; transform-origin: bottom; }

/* ===== 演出ステージ ===== */
.stage {
  position: relative;
  width: 210px;
  height: 354px;
  perspective: 1200px;
  margin-bottom: 28px;
}

.glow-ring {
  position: absolute;
  inset: -55px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,250,225,0.55) 0%, rgba(255,214,110,0.32) 32%, rgba(255,204,0,0.14) 55%, rgba(255,204,0,0) 75%);
  filter: blur(7px);
  opacity: 0;
  transform: scale(0.6);
  pointer-events: none;
}

/* 光の爆発：中心が明るく縁がふわっと消えるライトブルーム（輪郭のはっきりした集中線は避ける） */
.light-rays {
  position: absolute;
  inset: -110px;
  border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,246,214,0.38) 0deg 1.6deg, transparent 1.6deg 10deg);
  mask-image: radial-gradient(circle, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 48%, transparent 78%);
  -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.35) 48%, transparent 78%);
  filter: blur(1.5px);
  opacity: 0;
  pointer-events: none;
}

/* 上品グロー：浮遊する光の粒 */
.motes-container {
  position: absolute;
  inset: -20px;
  pointer-events: none;
  overflow: visible;
}
.mote {
  position: absolute;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,236,180,0.95), rgba(255,236,180,0));
  opacity: 0;
}
.ornate-frame {
  position: absolute;
  inset: -9px;
  border-radius: calc(var(--radius) + 6px);
  box-shadow: 0 0 0 1px rgba(255,204,0,0.5), inset 0 0 22px rgba(255,204,0,0.18);
  opacity: 0;
  pointer-events: none;
}

.gacha-card {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}

.gacha-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transform-style: preserve-3d;
  transition: none;
}
.gacha-card-inner.flip { transform: rotateY(180deg); }

.gacha-face {
  position: absolute;
  inset: 0;
  border-radius: var(--radius);
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 8px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.15);
}

.gacha-face-back {
  background:
    repeating-linear-gradient(45deg, rgba(255,204,0,0.08) 0 10px, transparent 10px 20px),
    linear-gradient(160deg, #241f42, #14112a);
  font-size: 3rem;
}
.gacha-face-back::after { content: '?'; color: var(--gold-soft); font-size: 3.2rem; opacity: 0.85; }

.gacha-face-front {
  transform: rotateY(180deg);
  overflow: hidden;
  background: #14112a;
}
.gacha-face-front img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.gacha-face-front .caption {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 8px 10px 7px;
  font-size: 0.7rem;
  font-weight: bold;
  color: #fff;
  text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  background: linear-gradient(0deg, rgba(0,0,0,0.75), rgba(0,0,0,0));
  text-align: center;
}

/* カードの周りにきらめく星（結果表示中ずっとランダムに明滅する） */
.sparkle-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: visible;
}

.sparkle {
  position: absolute;
  background: radial-gradient(circle, #fffdf4 0%, #ffe066 45%, rgba(255,224,102,0) 75%);
  clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
  opacity: 0;
  filter: drop-shadow(0 0 3px rgba(255,224,102,0.85));
}
.sparkle.twinkle {
  animation-name: sparkle-twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes sparkle-twinkle {
  0%, 100% { opacity: 0; transform: scale(0.2) rotate(0deg); }
  50%      { opacity: 1; transform: scale(1) rotate(45deg); }
}

.result-label {
  min-height: 1.4em;
  font-size: 0.85rem;
  color: var(--gold-soft);
  margin-bottom: 18px;
  letter-spacing: 0.03em;
}

.draw-btn {
  font-family: var(--font);
  font-size: 1rem;
  font-weight: bold;
  color: #241f42;
  background: linear-gradient(180deg, var(--gold-soft), var(--gold));
  border: none;
  border-radius: 999px;
  padding: 14px 42px;
  cursor: pointer;
  box-shadow: 0 6px 18px rgba(255,204,0,0.35);
  transition: transform 0.15s ease, opacity 0.2s ease;
}
.draw-btn:active { transform: scale(0.96); }
.draw-btn:disabled { opacity: 0.5; cursor: default; }

.history-title {
  font-size: 0.75rem;
  color: var(--muted);
  margin: 30px 0 10px;
  align-self: flex-start;
}

.history-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  width: 100%;
}

.history-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px 5px 8px;
  font-size: 0.72rem;
  color: var(--text);
  animation: chip-in 0.35s ease both;
}
.history-chip img { width: 22px; height: 37px; object-fit: cover; border-radius: 4px; }
@keyframes chip-in {
  from { opacity: 0; transform: translateY(6px) scale(0.9); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

.notice {
  margin-top: 34px;
  font-size: 0.68rem;
  color: var(--muted);
  text-align: center;
  line-height: 1.6;
  max-width: 380px;
}
</style>
</head>
<body>

<h1>🎴 裏面デザインガチャ — 演出プレビュー</h1>
<p class="subtitle">管理者/デバッガーロール専用（未リリース機能）</p>

<div id="gate-checking">権限を確認しています…</div>
<div id="gate-denied" style="display:none;">
  <strong>アクセス権がありません</strong>
  このページは管理者・デバッガーロール専用です。
</div>

<div id="flash-overlay" class="flash-overlay"></div>
<div id="letterbox-top" class="letterbox letterbox-top"></div>
<div id="letterbox-bottom" class="letterbox letterbox-bottom"></div>

<div id="gacha-app">
  <div class="variant-picker" id="variant-picker">
    <button type="button" class="variant-btn active" data-variant="burst">① 光の爆発</button>
    <button type="button" class="variant-btn" data-variant="elegant">② 上品グロー</button>
    <button type="button" class="variant-btn" data-variant="cinema">③ シネマティック</button>
  </div>

  <div class="stage" id="stage">
    <div class="light-rays" id="light-rays"></div>
    <div class="ornate-frame" id="ornate-frame"></div>
    <div class="motes-container" id="motes-container"></div>
    <div class="glow-ring" id="glow-ring"></div>
    <div class="gacha-card" id="gacha-card">
      <div class="gacha-card-inner" id="gacha-card-inner">
        <div class="gacha-face gacha-face-back"></div>
        <div class="gacha-face gacha-face-front" id="gacha-face-front">
          <img id="result-img" alt="">
          <div class="caption" id="result-name"></div>
        </div>
      </div>
    </div>
    <div class="sparkle-container" id="sparkle-container"></div>
  </div>

  <p class="result-label" id="result-label"></p>
  <button class="draw-btn" id="draw-btn">ガチャを引く</button>

  <p class="history-title">このセッションで引いた履歴</p>
  <div class="history-strip" id="history-strip"></div>

  <p class="notice">※ これは演出テスト用ページです。裏面デザイン画像は本番想定の素材ですが、チケット消費・所持データの保存・被り集計などは未実装です。演出は3パターン試作中で、上のボタンで切り替えられます。</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/canvas-confetti/1.9.3/confetti.browser.min.js"></script>
<script type="module">
import { db } from './firebaseConfig.js';
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { getUserId } from './userData.js';
import { GACHA_DESIGNS as DESIGNS } from './gachaBacks.js';

const gateChecking = document.getElementById('gate-checking');
const gateDenied   = document.getElementById('gate-denied');
const app          = document.getElementById('gacha-app');

async function checkAdminRole() {
  try {
    const snap = await getDoc(doc(db, 'sharedUserRoles', getUserId()));
    if (!snap.exists()) return false;
    const d = snap.data();
    return d.role === 'admin' || d.role === 'debugger' || !!d.debugOmikuji;
  } catch (e) {
    console.warn('[gacha-preview] role check failed', e);
    return false;
  }
}

async function init() {
  const isAdmin = await checkAdminRole();
  gateChecking.style.display = 'none';
  if (!isAdmin) {
    gateDenied.style.display = 'block';
    return;
  }
  app.classList.add('visible');
  setupGacha();
}

function setupGacha() {
  const stage      = document.getElementById('stage');
  const card       = document.getElementById('gacha-card');
  const inner      = document.getElementById('gacha-card-inner');
  const glowRing   = document.getElementById('glow-ring');
  const rays       = document.getElementById('light-rays');
  const motesBox   = document.getElementById('motes-container');
  const sparkleBox = document.getElementById('sparkle-container');
  const frame      = document.getElementById('ornate-frame');
  const flash      = document.getElementById('flash-overlay');
  const letterTop  = document.getElementById('letterbox-top');
  const letterBtm  = document.getElementById('letterbox-bottom');
  const drawBtn    = document.getElementById('draw-btn');
  const resultLbl  = document.getElementById('result-label');
  const resultImg  = document.getElementById('result-img');
  const resultName = document.getElementById('result-name');
  const historyStrip = document.getElementById('history-strip');

  let busy = false;
  let currentVariant = 'burst';

  document.querySelectorAll('.variant-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (busy) return;
      document.querySelectorAll('.variant-btn').forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
      currentVariant = btn.dataset.variant;
    });
  });

  function pickDesign() {
    return DESIGNS[Math.floor(Math.random() * DESIGNS.length)];
  }

  function addHistory(design) {
    const chip = document.createElement('div');
    chip.className = 'history-chip';
    chip.innerHTML = `<img src="${design.url}" alt=""><span>${design.name}</span>`;
    historyStrip.prepend(chip);
  }

  function fireConfetti(opts) {
    if (typeof confetti !== 'function') return;
    confetti(Object.assign({
      particleCount: 100,
      spread: 70,
      startVelocity: 42,
      origin: { y: 0.55 },
      colors: ['#ffcc00', '#ffe37a', '#ffffff', '#8a6bff'],
    }, opts));
  }

  function revealResult(design) {
    resultImg.src = design.url;
    resultName.textContent = design.name;
  }

  function finishResult(design, confettiOpts) {
    fireConfetti(confettiOpts);
    resultLbl.textContent = `「${design.name}」を手に入れた！`;
    spawnSparkles(10);
    addHistory(design);
  }

  // カードの縁のすぐ外側にランダムな位置・タイミングできらめく星を配置する
  function spawnSparkles(n) {
    sparkleBox.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('div');
      s.className = 'sparkle twinkle';
      const edge = Math.floor(Math.random() * 4); // 0:上 1:右 2:下 3:左
      let x, y;
      if (edge === 0)      { x = Math.random() * 100; y = -6 - Math.random() * 6; }
      else if (edge === 1) { x = 100 + Math.random() * 6; y = Math.random() * 100; }
      else if (edge === 2) { x = Math.random() * 100; y = 100 + Math.random() * 6; }
      else                 { x = -6 - Math.random() * 6; y = Math.random() * 100; }
      s.style.left = `${x}%`;
      s.style.top = `${y}%`;
      const size = 8 + Math.random() * 8;
      s.style.width = `${size}px`;
      s.style.height = `${size}px`;
      s.style.animationDuration = `${1.0 + Math.random() * 0.9}s`;
      s.style.animationDelay = `${-Math.random() * 1.9}s`; // マイナス遅延で最初からバラバラの位相にする
      sparkleBox.appendChild(s);
    }
  }

  function spawnMotes(n) {
    motesBox.innerHTML = '';
    for (let i = 0; i < n; i++) {
      const m = document.createElement('div');
      m.className = 'mote';
      m.style.left = `${Math.random() * 100}%`;
      m.style.bottom = `${Math.random() * 15}%`;
      motesBox.appendChild(m);
    }
    return motesBox.querySelectorAll('.mote');
  }

  function resetFx() {
    gsap.set(rays, { opacity: 0, scale: 1, rotate: 0 });
    gsap.set(frame, { opacity: 0 });
    gsap.set(flash, { opacity: 0 });
    gsap.set([letterTop, letterBtm], { scaleY: 0 });
    gsap.set(stage, { scale: 1 });
    motesBox.innerHTML = '';
    sparkleBox.innerHTML = '';
  }

  // ① 光の爆発：勢いよく弾ける、派手でにぎやかな演出
  function playBurst(design) {
    return new Promise((resolve) => {
      const tl = gsap.timeline({ onComplete: resolve });
      tl.set(glowRing, { opacity: 0, scale: 0.6 })
        .set(rays, { opacity: 0, scale: 0.5, rotate: 0 })
        .to(card, { scale: 1.06, duration: 0.2, ease: 'power1.out' })
        .to(card, { scale: 1, duration: 0.16, ease: 'power1.in' })
        .to(card, { rotate: -5, duration: 0.06, repeat: 9, yoyo: true, ease: 'power1.inOut' }, '<')
        .to(rays, { opacity: 0.9, scale: 1.5, rotate: 140, duration: 1.0, ease: 'power2.out' }, '<')
        .to(glowRing, { opacity: 1, scale: 1.6, duration: 1.0, ease: 'power2.out' }, '<')
        .to(card, { scale: 1.18, duration: 0.3, ease: 'power3.in' }, '-=0.15')
        .to(flash, { opacity: 0.85, duration: 0.08 })
        .call(() => revealResult(design))
        .to(flash, { opacity: 0, duration: 0.35 }, '<')
        .to(inner, { duration: 0.55, ease: 'back.out(2)', rotateY: 180 }, '<')
        .call(() => finishResult(design, {
          particleCount: 150, spread: 95, startVelocity: 55,
          colors: ['#ffcc00', '#ff5a5a', '#ffffff', '#8a6bff'],
        }))
        .to(rays, { opacity: 0, duration: 0.5 }, '<')
        .to(card, { scale: 1, duration: 0.3, ease: 'power2.out' })
        .to(glowRing, { opacity: 0, duration: 0.5 }, '<');
    });
  }

  // ② 上品グロー：ゆっくり丁寧に、光の粒が舞い上がる落ち着いた演出
  function playElegant(design) {
    return new Promise((resolve) => {
      const motes = spawnMotes(16);
      const tl = gsap.timeline({ onComplete: resolve });
      tl.set(glowRing, { opacity: 0, scale: 0.7 })
        .set(frame, { opacity: 0 })
        .to(card, { scale: 1.03, duration: 0.6, ease: 'sine.inOut' })
        .to(glowRing, { opacity: 0.8, scale: 1.3, duration: 1.4, ease: 'sine.inOut' }, '<')
        .to(motes, { opacity: 1, y: -46, duration: 1.6, stagger: 0.06, ease: 'sine.out' }, '<')
        .to(card, { scale: 1.1, duration: 0.5, ease: 'sine.inOut' })
        .call(() => revealResult(design))
        .to(inner, { duration: 1.1, ease: 'power2.inOut', rotateY: 180 })
        .to(frame, { opacity: 1, duration: 0.6 }, '<+=0.3')
        .call(() => finishResult(design, {
          particleCount: 36, spread: 50, startVelocity: 18, gravity: 0.5,
          colors: ['#ffe066', '#ffffff'],
        }))
        .to(motes, { opacity: 0, duration: 0.6 }, '<')
        .to(card, { scale: 1, duration: 0.5, ease: 'sine.inOut' })
        .to(glowRing, { opacity: 0, duration: 0.7 }, '<')
        .to(frame, { opacity: 0, duration: 0.7 }, '<');
    });
  }

  // ③ シネマティック：レターボックスとゆっくりズームで映画風に見せる演出
  function playCinema(design) {
    return new Promise((resolve) => {
      const tl = gsap.timeline({ onComplete: resolve });
      tl.to([letterTop, letterBtm], { scaleY: 1, duration: 0.4, ease: 'power2.out' })
        .to(stage, { scale: 1.08, duration: 2.4, ease: 'sine.inOut' }, 0)
        .to(card, { scale: 1.05, duration: 0.3, ease: 'power1.out' }, 0.45)
        .to(card, { rotate: -3, duration: 0.08, repeat: 6, yoyo: true, ease: 'power1.inOut' }, '<')
        .to(glowRing, { opacity: 1, scale: 1.4, duration: 1.2, ease: 'power2.out' }, '<')
        .to(card, { scale: 1.15, duration: 0.4, ease: 'power3.in' })
        .to({}, { duration: 0.35 }) // 溜めの間
        .call(() => revealResult(design))
        .to(inner, { duration: 0.8, ease: 'power4.out', rotateY: 180 })
        .call(() => finishResult(design, {
          particleCount: 60, spread: 100, startVelocity: 35, gravity: 0.3, ticks: 320,
          colors: ['#ffcc00', '#ffffff'],
        }))
        .to(card, { scale: 1, duration: 0.3, ease: 'power2.out' })
        .to(glowRing, { opacity: 0, duration: 0.5 }, '<')
        .to(stage, { scale: 1, duration: 0.6, ease: 'sine.inOut' }, '<')
        .to([letterTop, letterBtm], { scaleY: 0, duration: 0.5, ease: 'power2.in' }, '+=0.4');
    });
  }

  async function playGacha() {
    if (busy) return;
    busy = true;
    drawBtn.disabled = true;
    resultLbl.textContent = '';
    inner.classList.remove('flip');
    resetFx();
    void inner.offsetWidth; // reflow でアニメを確実にリセット

    const design = pickDesign();
    const preload = new Image();
    preload.src = design.url; // 溜め演出の間に先読みしておく

    if (currentVariant === 'elegant') await playElegant(design);
    else if (currentVariant === 'cinema') await playCinema(design);
    else await playBurst(design);

    drawBtn.disabled = false;
    busy = false;
  }

  drawBtn.addEventListener('click', playGacha);
}

init();
</script>
</body>
</html>
